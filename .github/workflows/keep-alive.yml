name: Keep Render backend awake

# Render's free tier sleeps after ~15 minutes without traffic.
# This pings the health endpoint every 10 minutes so the API stays warm.
# Set the repository variable BACKEND_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://cafe-order-api.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repository variable is not set"; exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$BACKEND_URL/api/health"
